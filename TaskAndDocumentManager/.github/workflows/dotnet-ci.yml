name: .NET CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIGURATION: Release
  APP_PROJECT_PATH: TaskAndDocumentManager.csproj
  TEST_PROJECT_PATH: Application/Tests/Tests.csproj
  PUBLISH_DIR: artifacts/publish
  TEST_RESULTS_DIR: artifacts/test-results
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test-publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore API
        run: dotnet restore "${{ env.APP_PROJECT_PATH }}"

      - name: Restore tests
        run: dotnet restore "${{ env.TEST_PROJECT_PATH }}"

      - name: Build API
        run: dotnet build "${{ env.APP_PROJECT_PATH }}" --configuration "${{ env.CONFIGURATION }}" --no-restore

      - name: Test
        run: dotnet test "${{ env.TEST_PROJECT_PATH }}" --configuration "${{ env.CONFIGURATION }}" --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory "${{ env.TEST_RESULTS_DIR }}"

      - name: Publish
        run: dotnet publish "${{ env.APP_PROJECT_PATH }}" --configuration "${{ env.CONFIGURATION }}" --no-restore --output "${{ env.PUBLISH_DIR }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_DIR }}

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: task-and-document-manager-api
          path: ${{ env.PUBLISH_DIR }}

  deployment-ready:
    name: Deployment ready
    runs-on: ubuntu-latest
    needs: build-test-publish
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deployment target not configured
        run: |
          echo "Build, tests, and publish completed successfully."
          echo "Add the real deployment step here after choosing a hosting target."
